<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión de Balanzas CGPBB, demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#15171C; --muted:#4A5160;
  --line:#DDE1E7; --line-2:#E3E6EB; --input:#CDD2DA; --brand:#10245C; --brand-2:#1C3576; --brand-ink:#FFFFFF;
  --brand-soft:#E9EEF9; --brand-text:#10245C; --info:#0B4DB7; --info-soft:#E6EEFB;
  --warn:#8A4300; --warn-soft:#FFF1DC; --note:#FFF4E5; --note-ink:#6B3600;
  --top-bg:#10245C; --top-muted:#C9D3EA; --top-line:#3A4E86;
  --visor-bg:#0F1E45; --visor-muted:#B8C2DA; --visor-pill:#1F3A7A;
  --focus:#1D5FD6; --shadow:0 18px 50px rgba(10,20,45,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1218; --surface:#161B24; --surface-2:#1C2230; --ink:#E7EAF0; --muted:#A7AFBD;
    --line:#2B3342; --line-2:#252C39; --input:#374154; --brand:#3656B8; --brand-2:#27407F; --brand-ink:#FFFFFF;
    --brand-soft:#1D2946; --brand-text:#A9C1FF; --info:#93B6FF; --info-soft:#1A2A47;
    --warn:#FFB866; --warn-soft:#3A2711; --note:#33230F; --note-ink:#FFD29A;
    --top-bg:#0B1633; --top-muted:#B4C0DC; --top-line:#263A74;
    --visor-bg:#060C1E; --visor-muted:#A3B0CF; --visor-pill:#1A2C5E;
    --focus:#7FA8FF; --shadow:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
    --bg:#0E1218; --surface:#161B24; --surface-2:#1C2230; --ink:#E7EAF0; --muted:#A7AFBD;
    --line:#2B3342; --line-2:#252C39; --input:#374154; --brand:#3656B8; --brand-2:#27407F; --brand-ink:#FFFFFF;
    --brand-soft:#1D2946; --brand-text:#A9C1FF; --info:#93B6FF; --info-soft:#1A2A47;
    --warn:#FFB866; --warn-soft:#3A2711; --note:#33230F; --note-ink:#FFD29A;
    --top-bg:#0B1633; --top-muted:#B4C0DC; --top-line:#263A74;
    --visor-bg:#060C1E; --visor-muted:#A3B0CF; --visor-pill:#1A2C5E;
    --focus:#7FA8FF; --shadow:0 18px 50px rgba(0,0,0,.5);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700}
h2{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}

/* estructura */
#app{height:100%;display:grid;grid-template-rows:64px 46px minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;background:var(--top-bg);color:#fff;min-width:0}
.top-l,.top-r{display:flex;align-items:center;gap:16px;min-width:0}
.top-r{gap:20px}
.brand{font-size:18px;font-weight:700;white-space:nowrap}
.brand-sub{font-size:14px;color:var(--top-muted)}
.top .sep{width:1px;height:24px;background:var(--top-line)}
.place{height:38px;border:1px solid transparent;border-radius:8px;background:transparent;color:#fff;font-size:15px;font-weight:500;padding:0 8px;cursor:pointer;max-width:280px}
.place:hover{border-color:var(--top-line)}
.place option{color:#15171C}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill.on{background:var(--brand-2);color:#fff}.pill.on .dot{background:#8FBCFF}
.pill.off{background:#FFE2B8;color:#5A2C00;font-weight:500}.pill.off .dot{background:#C25E00}
.pill.sync{background:var(--brand-2);color:#fff}.pill.sync .dot{background:#8FBCFF;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.who{font-size:13px;color:var(--top-muted);white-space:nowrap}
.tbtn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--top-line);background:transparent;color:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--brand-2)}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.navbar .tabs2{display:flex;gap:2px;overflow-x:auto;height:100%}
.navbar .tabs2 a{display:flex;align-items:center;padding:0 12px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.navbar .tabs2 a:hover{color:var(--ink)}
.navbar .tabs2 a[aria-current="page"]{color:var(--brand-text);border-bottom-color:var(--brand-text);font-weight:600}
.main{overflow:auto;padding:20px 24px 90px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:24px}
.page-head p{margin-top:4px}

/* componentes */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.slabel{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);padding:0 22px}
.btn.primary:hover:not(:disabled){background:var(--brand-2);border-color:var(--brand-2)}
.btn.outline{border-color:var(--brand-text);color:var(--brand-text)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.xl{height:56px;font-size:16px;border-radius:10px}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-info{background:var(--info-soft);color:var(--info)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-muted{background:var(--brand-soft);color:var(--brand-text)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field>span em{font-style:normal;color:var(--info);font-weight:600;font-size:11px}
.field input,.field select,.field textarea{height:40px;border:1px solid var(--input);border-radius:8px;background:var(--surface);padding:0 12px;min-width:0;width:100%;font-size:14px}
.field textarea{height:auto;padding:10px 12px;resize:vertical;min-height:58px}
.field input[readonly],.field textarea[readonly]{background:var(--surface-2)}
.field input:disabled,.field select:disabled{background:var(--surface-2);opacity:.8}
.platebox{height:40px;display:flex;align-items:center}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--bg);font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr:hover td{background:var(--surface-2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--brand-text);border-bottom-color:var(--brand-text);font-weight:600}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.4}
.note.warn{background:var(--note);color:var(--note-ink)}
.note.info{background:var(--info-soft);color:var(--info)}
.note svg{flex-shrink:0;margin-top:1px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
.kv dd{margin:0;font-weight:500;overflow-wrap:break-word}

/* patente argentina */
.plate{display:inline-flex;flex-direction:column;vertical-align:middle;border:1.5px solid #1A1A1A;border-radius:5px;background:#FFFFFF;color:#111111;overflow:hidden;line-height:1;flex-shrink:0}
.plate-band{background:#1B3F9C;color:#FFFFFF;height:9px;display:flex;align-items:center;justify-content:center;gap:4px;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:5.5px;font-weight:700;letter-spacing:.4px;padding:0 4px;white-space:nowrap}
.plate-band svg{display:block}
.plate-num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:19px;letter-spacing:1.2px;padding:2px 9px 3px;text-align:center;white-space:nowrap}
.plates{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.plates .cap{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}

/* puesto */
.puesto{display:grid;grid-template-columns:360px minmax(0,1fr) 340px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.visor{background:var(--visor-bg);color:#FFFFFF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.visor .vlabel{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--visor-muted)}
.vnum{display:flex;align-items:baseline;gap:10px}
.vnum #visor-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:68px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.vunit{font-size:22px;color:var(--visor-muted)}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vstate{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--visor-pill);font-size:13px;font-weight:600}
.vstate i{width:8px;height:8px;border-radius:50%;background:#7F8BA8}
.vstate.stable i{background:#8FBCFF}
.vstate.moving i{background:#FFB45C;animation:blink .6s infinite}
.vconn{font-size:12px;color:var(--visor-muted)}
.ejes-card{padding:18px;display:flex;flex-direction:column;gap:12px}
.axles{display:flex;gap:10px}
.axle{display:flex;flex-direction:column;align-items:center;gap:4px}
.axle span{width:34px;height:14px;border-radius:7px;background:var(--brand-text)}
.axle small{font-size:11px;color:var(--muted)}
.meter{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand-text)}
.meter.over span{background:var(--warn)}
.kline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.kline b{color:var(--ink);font-weight:500}
.cert{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.ticket{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.tk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tk-head p{margin-top:4px;font-size:13px;color:var(--muted)}
.tk-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.tk-actions .row{gap:12px}
.weights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wbox .lbl{font-size:12px;color:var(--muted)}
.wbox .val{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.wbox .soft{font-size:14px;font-weight:600;color:var(--muted);padding-top:4px}
.wbox.live{border-style:dashed;border-color:var(--brand-text)}
.wbox.net{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.wbox.net .lbl,.wbox.net .soft{color:var(--top-muted)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer}
.pitem:hover{border-color:var(--muted)}
.pitem[aria-pressed="true"]{border-color:var(--brand-text);background:var(--brand-soft)}
.pitem .l{display:flex;flex-direction:column;gap:5px;min-width:0}
.pitem .sub{font-size:12px;color:var(--muted)}
.pitem .t{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.simbox{border:1px dashed var(--muted);border-radius:12px;background:transparent}
.simbox summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px}
.simbox .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.simbox .row .btn{flex:1}
.g4c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.55fr) minmax(0,1.6fr);gap:12px 16px}

/* panel */
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.filters .field select{background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.bars{height:196px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:44px;border-radius:4px 4px 0 0;background:var(--brand-text)}
.bar b{font-size:11px;font-weight:400;color:var(--muted)}
.bars-x{display:flex;gap:12px;padding-top:6px}
.bars-x span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.bcard{border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12px}

/* diálogos y avisos */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(580px,calc(100% - 32px));max-height:calc(100% - 40px);box-shadow:var(--shadow)}
dialog.wide{width:min(880px,calc(100% - 32px))}
dialog.narrow{width:min(430px,calc(100% - 32px))}
dialog::backdrop{background:rgba(8,14,32,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.dlg-h h2{font-size:17px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.xbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100% - 40px))}
.toast{background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease-out}
.toast.warn{background:#6A3400;color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--top-bg);overflow:auto}
.login-card{width:min(440px,100%);padding:28px;display:flex;flex-direction:column;gap:16px}
.login-card .lbrand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.login-card .lbrand small{font-size:14px;font-weight:500;color:var(--muted)}
.comp{background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:14px}
.comp .qcard{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.comp .qrbox{padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px}
.comp .qr{display:block}
.comp .dcard{padding:6px 16px}
.comp .drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--bg);font-size:13px}
.comp .drow:last-child{border-bottom:0}
.comp .drow span:first-child{color:var(--muted)}
.comp .drow span:last-child{text-align:right;font-weight:500}
.comp .w3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.comp .w3>div{padding:10px;display:flex;flex-direction:column;gap:2px}
.comp .w3 small{font-size:11px;color:var(--muted)}
.comp .w3 b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px}
.comp .w3 .net{background:var(--brand);border-color:var(--brand);color:#fff;border-radius:12px}
.comp .w3 .net small{color:var(--top-muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

@media (max-width:1380px){
  .puesto{grid-template-columns:330px minmax(0,1fr)}
  .puesto>.col-side{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .who{display:none}
}
@media (max-width:1040px){
  .puesto{grid-template-columns:1fr}
  .puesto>.col-side{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash{grid-template-columns:1fr}
  .brand-sub,.top .sep{display:none}
}
@media (max-width:1040px){.g4c{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  #app{grid-template-rows:auto 46px minmax(0,1fr)}
  .g4c{grid-template-columns:1fr}
  .top{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .g2,.g3,.g4,.kv,.weights{grid-template-columns:1fr}
  .main{padding:16px 14px 90px}
  .vnum #visor-num{font-size:54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:fixed;left:0;top:0;width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */

function bal0(s,id){for(var i=0;i<s.balanzas.length;i++)if(s.balanzas[i].id===id)return s.balanzas[i];return s.balanzas[0];}
function aud0(ts,u,r,a,d,tid){return {ts:ts,usuario:u,rol:r,accion:a,detalle:d,ticketId:tid||null};}

var S;
function load(){
  try{var raw=localStorage.getItem(LS_KEY);if(raw){var o=JSON.parse(raw);if(o&&o.version===1&&Date.now()-o.seededAt<18*HOUR){S=o;return;}}}catch(e){}
  S=seed();
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
load();

/* ---------- consultas ---------- */
function bal(id){return bal0(S,id==null?S.balanzaId:id);}
function lugar(id){for(var i=0;i<S.lugares.length;i++)if(S.lugares[i].id===id)return S.lugares[i];return {id:id,nombre:id};}
function byId(arr,id){id=Number(id);for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function tk(id){return byId(S.tickets,id);}
function cliente(id){var c=byId(S.clientes,id);return c?c.razon:'-';}
function producto(id){var p=byId(S.productos,id);return p?p.nombre:'-';}
function buque(id){var b=byId(S.buques,id);return b?b.nombre+' (IMO '+b.imo+')':'-';}
function buqueN(id){var b=byId(S.buques,id);return b?b.nombre:'-';}
function ata(id){var a=byId(S.atas,id);return a?a.razon+', CUIT '+a.cuit:'-';}
function chofer(dni){for(var i=0;i<S.choferes.length;i++)if(S.choferes[i].dni===String(dni))return S.choferes[i];return null;}
function choferN(dni){var c=chofer(dni);return c?c.apellido+', '+c.nombre+' (DNI '+Number(c.dni).toLocaleString('es-AR')+')':'DNI '+dni;}
function simDe(cid,pid){for(var i=0;i<S.documentos.length;i++){var d=S.documentos[i];if(d.clienteId===Number(cid)&&d.productoId===Number(pid))return d.sim;}return null;}
function balLabel(id){var b=bal(id);return b.nombre+', '+lugar(b.lugar).nombre;}
function ejesEval(ejes,bruto){
  var max=S.reglas.ejes[ejes]||0, lim=Math.round(max*(1+S.reglas.tolerancia/100));
  var pct=max?bruto/max*100:0;
  return {max:max,lim:lim,pct:pct,estado:bruto>lim?'excede':(bruto>max?'tolerancia':'ok')};
}
function certEstado(c){var d=Math.ceil((c.hasta-Date.now())/DAY);if(d<0)return {d:d,txt:'Vencido',cls:'b-warn'};if(d<=30)return {d:d,txt:'Vence en '+d+' días',cls:'b-warn'};return {d:d,txt:'Vigente',cls:'b-info'};}

function audit(accion,detalle,tid){
  S.auditoria.unshift({ts:Date.now(),usuario:S.user?S.user.nombre:'Sistema',rol:S.user?S.user.rol:'',accion:accion,detalle:detalle,ticketId:tid||null});

}

/* ---------- simulación de balanza ---------- */
var SC={valor:0,objetivo:0,estable:true,since:0};
function tickScale(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var diff=SC.objetivo-SC.valor;
  if(Math.abs(diff)>30){
    SC.valor+= reduce?diff:diff*0.45+(Math.random()-0.5)*Math.min(160,Math.abs(diff)*0.25);
    SC.estable=false;SC.since=0;
  } else {
    if(!SC.since)SC.since=Date.now();
    if(Date.now()-SC.since>600||reduce){SC.valor=SC.objetivo;SC.estable=true;}
    else{SC.valor=SC.objetivo+(Math.random()-0.5)*60;SC.estable=false;}
  }
  if(SC.valor<0)SC.valor=0;
  updateLive();
}
setInterval(tickScale,130);
function lectura(){return Math.max(0,r20(SC.valor));}

/* ---------- ruteo y render ---------- */
function route(){var h=location.hash.replace(/^#\/?/,'')||'puesto';var parts=h.split('/');return {v:parts[0],p:parts[1]||''};}
window.addEventListener('hashchange',function(){render();});
function render(){
  var app=$('#app');
  if(!S.user){app.innerHTML=viewLogin();var d=$('#simdock');if(d)d.remove();return;}
  var r=route();
  app.innerHTML=viewTop()+viewNav(r.v)+'<main class="main" id="main">'+viewMain(r)+'</main>';
  renderDock(r.v);
  updateLive();
}
function viewMain(r){
  switch(r.v){
    case 'tickets':return viewTickets();
    case 'panel':return viewPanel();
    case 'maestros':return viewMaestros(r.p||'clientes');
    case 'reglas':return viewReglas();
    case 'calibracion':return viewCal();
    case 'auditoria':return viewAudit();
    default:return viewPuesto();
  }
}

    '<div class="wbox"><span class="lbl">Salida</span><span class="soft">En el segundo pesaje</span></div>'+
    '<div class="wbox net"><span class="lbl">Neto</span><span class="soft">Se calcula al cerrar</span></div>';
}
function missing(){
  var d=UI.draft,m=[];
  if(!d.buqueId)m.push('buque');if(!d.clienteId)m.push('cliente');if(!d.productoId)m.push('producto');
  if(!normPat(d.patente))m.push('patente');if(!d.dni||d.dni.length<7)m.push('DNI');
  else if(!chofer(d.dni)&&(!d.apellido||!d.nombre))m.push('datos del chofer');
  if(!UI.captura)m.push('peso de entrada');
  return m;
}
function updNuevo(){
  var btn=$('#btn-registrar');if(!btn)return;
  var m=missing();btn.disabled=m.length>0;
  var msg=$('#req-msg');if(msg)msg.textContent=m.length?'Falta: '+m.join(', '):'';
}

  var head='<div class="tk-head"><div><h1>Ticket N.º '+num(t.id)+'</h1><p>Primer pesaje registrado a las '+hora(t.entrada.ts)+' · '+esc(placeTxt(bal(t.balEnt)))+(otra&&!fin?' · sincronizado desde otra balanza':'')+'</p></div>'+
    (fin?(t.estado==='Anulado'?'<span class="badge b-warn">Anulado</span>':'<span class="badge b-info">Finalizado</span>'):'<span class="badge b-warn">Pendiente de segundo pesaje</span>')+'</div>';
  var a=byId(S.atas,t.ataId);var bq=byId(S.buques,t.buqueId);var c=chofer(t.dni);
  var body='<div class="slabel">Operación</div><div class="g2">'+
     roField('Orden de trabajo',t.ot||'-')+roField('Buque',bq?bq.nombre+' · IMO '+bq.imo:'-')+
     roField('Cliente',cliente(t.clienteId))+roField('Producto',producto(t.productoId))+
     roField('Documentación de aduana','SIM '+t.sim,'Autocompletado')+roField('ATA',a?a.razon+' · '+a.cuit:'-')+
    '</div><div class="slabel">Camión y chofer</div><div class="g4c">'+
     plateField('Patente camión',t.patente)+plateField('Patente acoplado',t.acoplado)+roField('Cantidad de ejes',String(t.ejes))+
     roField('Chofer',c?c.apellido+', '+c.nombre:'Sin registrar',c?'DNI '+Number(c.dni).toLocaleString('es-AR'):'DNI '+t.dni)+
    '</div><div class="slabel">Pesos</div><div class="weights" id="w-box">'+wSegundo(t,fin)+'</div>'+
    '<label class="field"><span>Observaciones</span><textarea data-bind="obs2" rows="2"'+(fin?' readonly':'')+'>'+esc(fin?(t.obs||''):UI.obs2)+'</textarea></label>'+
    (fin?'':'<div id="exceso-box">'+excesoBox(t)+'</div>');
  var canAn=t.estado!=='Anulado';
  var act='<div class="tk-actions"><button class="btn warn" data-act="anular" data-id="'+t.id+'"'+(canAn?'':' disabled')+'>Anular ticket</button><div class="row">'+
    '<button class="btn outline" data-act="imprimir" data-id="'+t.id+'"'+(fin&&t.estado==='Finalizado'?'':' disabled')+'>Imprimir</button>'+
    '<button class="btn outline" data-act="enviar" data-id="'+t.id+'"'+(fin&&t.estado==='Finalizado'?'':' disabled')+'>Enviar comprobante</button>'+
    (fin?'<button class="btn primary" data-act="nuevo">Nuevo ticket</button>':'<button class="btn primary" id="btn-cerrar" data-act="cerrar"'+(canCerrar(t)?'':' disabled')+'>Cerrar ticket</button>')+
    '</div></div>';
  return head+body+act;

function wSegundo(t,fin){
  var cap=fin?t.salida:UI.captura;
  var ent='<div class="wbox"><span class="lbl">'+(t.entrada.peso<=(cap?cap.peso:lectura())?'Entrada (tara)':'Entrada (bruto)')+' · '+hora(t.entrada.ts)+(t.entrada.manual?' · manual':'')+'</span><span class="val">'+kg(t.entrada.peso)+' kg</span></div>';
  var sal=cap?'<div class="wbox"><span class="lbl">Salida · '+hora(cap.ts)+(cap.manual?' · manual':'')+'</span><span class="val">'+kg(cap.peso)+' kg</span></div>'
             :'<div class="wbox live"><span class="lbl">Salida · lectura actual</span><span class="val">'+kg(lectura())+' kg</span></div>';
  var net=cap?'<div class="wbox net"><span class="lbl">Neto</span><span class="val">'+kg(Math.abs(cap.peso-t.entrada.peso))+' kg</span></div>'
             :'<div class="wbox net"><span class="lbl">Neto</span><span class="soft">Se calcula al capturar</span></div>';
  return ent+sal+net;
}
function ejesCtx(){
  var t=tk(UI.sel);
  if(UI.modo==='final'&&t&&t.salida)return {ejes:t.ejes,bruto:Math.max(t.entrada.peso,t.salida.peso),cap:true};
  if(UI.modo==='segundo'&&t){var s=UI.captura?UI.captura.peso:lectura();return {ejes:t.ejes,bruto:Math.max(t.entrada.peso,s),cap:!!UI.captura};}
  return {ejes:Number(UI.draft.ejes)||5,bruto:UI.captura?UI.captura.peso:lectura(),cap:!!UI.captura};
}
function ejesCard(){
  var c=ejesCtx(),ev=ejesEval(c.ejes,c.bruto);
  var w=Math.min(100,c.bruto/ev.max*100);
  var ax='';for(var i=1;i<=c.ejes;i++)ax+='<div class="axle"><span></span><small>E'+i+'</small></div>';
  var badge=ev.estado==='excede'?'<span class="badge b-warn">Excede el máximo admisible</span>':(ev.estado==='tolerancia'?'<span class="badge b-info">Dentro de la tolerancia</span>':'<span class="badge b-info">Dentro del límite</span>');
  return '<h2>Control por ejes</h2><div class="axles" aria-hidden="true">'+ax+'</div>'+
    '<div class="kline"><span>'+c.ejes+' ejes · máximo admisible</span><b class="mono">'+kg(ev.max)+' kg</b></div>'+
    '<div class="meter'+(ev.estado==='excede'?' over':'')+'"><span style="width:'+w.toFixed(1)+'%"></span></div>'+
    '<div class="kline"><span>'+(c.cap?'Peso capturado':'Lectura actual')+': '+Math.round(ev.pct)+'% del máximo</span><span>Tolerancia '+S.reglas.tolerancia+'%</span></div>'+
    '<div>'+badge+'</div>';
}
function excesoBox(t){
  var c=UI.captura;if(!c)return '';
  var ev=ejesEval(t.ejes,Math.max(t.entrada.peso,c.peso));
  if(ev.estado!=='excede')return '';
  return '<div class="note warn">'+ico('alert')+'<div class="stack" style="gap:8px"><span>El peso bruto supera el máximo admisible para '+t.ejes+' ejes, incluso con la tolerancia configurada. El ticket se puede cerrar, y el exceso queda registrado en la auditoría.</span>'+
   '<label class="check"><input type="checkbox" data-bind="confirmExceso"'+(UI.confirmExceso?' checked':'')+'> Confirmo el cierre con exceso de peso</label></div></div>';
}
function canCerrar(t){
  var c=UI.captura;if(!c)return false;
  var ev=ejesEval(t.ejes,Math.max(t.entrada.peso,c.peso));
  return ev.estado!=='excede'||UI.confirmExceso;
}
function pendList(){
  var b=bal();var q=UI.pq.trim().toLowerCase();
  return S.tickets.filter(function(t){return t.estado==='Pendiente'&&t.lugar===b.lugar;}).filter(function(t){
    if(!q)return true;
    var hay=[t.patente,t.acoplado,t.patente.replace(/ /g,''),num(t.id),String(t.id),buqueN(t.buqueId),fecha(t.entrada.ts),cliente(t.clienteId)].join(' ').toLowerCase();
    return hay.indexOf(q)>=0;
  }).sort(function(a,b2){return a.entrada.ts-b2.entrada.ts;});
}
function viewPendPanel(){
  var n=S.tickets.filter(function(t){return t.estado==='Pendiente'&&t.lugar===bal().lugar;}).length;
  return '<section class="card pad stack" style="gap:12px"><div class="row between" style="flex-wrap:nowrap"><h2>Pendientes de segundo pesaje</h2><span class="badge b-muted" id="pend-n">'+n+'</span></div>'+
   '<label class="field"><span>Buscar</span><input type="search" data-bind="pq" value="'+esc(UI.pq)+'" placeholder="Patente, ticket, buque o fecha"></label>'+
   '<div class="plist" id="plist">'+pendItems()+'</div>'+
   '<button class="btn outline" data-act="nuevo">Nuevo ticket</button></section>';
}

  return l.map(function(t){
    var on=(UI.modo==='segundo')&&UI.sel===t.id;
    return '<button class="pitem" data-act="sel" data-id="'+t.id+'" aria-pressed="'+on+'"><span class="l">'+plate(t.patente)+'<span class="sub">'+esc(buqueN(t.buqueId))+'</span></span><span class="t">Ingreso '+hora(t.entrada.ts)+(t.balEnt!==S.balanzaId?'<br><span class="small">'+esc(bal(t.balEnt).nombre)+'</span>':'')+'</span></button>';
  }).join('');
}
function viewAlertas(){

function seleccionar(id){SC.objetivo=0;UI.modo='segundo';UI.sel=Number(id);UI.captura=null;UI.obs2='';UI.confirmExceso=false;renderTicketCol();}
function cerrar(){
  var t=tk(UI.sel),c=UI.captura,b=bal();if(!t||!c||!canCerrar(t))return;
  t.salida={peso:c.peso,ts:c.ts,manual:!!c.manual,autoriza:c.autoriza||null};t.balSal=b.id;
  t.neto=Math.abs(c.peso-t.entrada.peso);
  var ev=ejesEval(t.ejes,Math.max(t.entrada.peso,c.peso));t.excedido=ev.estado==='excede';
  t.estado='Finalizado';if(UI.obs2.trim())t.obs=UI.obs2.trim();
  t.sync=b.online;if(!b.online)b.pendSync++;
  audit('Ticket cerrado','Ticket '+num(t.id)+', neto '+kg(t.neto)+' kg'+(c.manual?' (salida manual autorizada por '+c.autoriza+')':''),t.id);
  if(t.excedido)audit('Cierre con exceso de peso por ejes','Ticket '+num(t.id)+': bruto '+kg(Math.max(t.entrada.peso,c.peso))+' kg, límite '+kg(ev.lim)+' kg para '+t.ejes+' ejes',t.id);
  UI.modo='final';UI.captura=null;UI.obs2='';UI.confirmExceso=false;save();
  SC.objetivo=0;
  render();openComprobante(t.id);
  if(S.parametros.envioAutomatico)toast('Comprobante enviado por correo a los destinatarios configurados.');
}
function simSubir(){
  if(UI.modo==='final'){toast('Iniciá un nuevo ticket o elegí un pendiente para pesar otro camión.');return;}
  if(UI.modo==='segundo'){var t=tk(UI.sel);SC.objetivo=t&&t.simSalida?t.simSalida:r20(40000+Math.random()*5000);}
  else if(UI.draft.control){SC.objetivo=0;toast('Pesada de control: la balanza queda en cero.');}
  else SC.objetivo=UI.draft.tipo==='Descarga'?r20(38000+Math.random()*6000):r20(13500+Math.random()*2500);
}
function toggleConn(){
  var b=bal();
  if(b.online){b.online=false;audit('Conectividad perdida',b.nombre+' pasa a operar en modo local');save();toast(b.nombre+' opera en modo local. Los registros se guardan en el puesto.','warn');render();return;}
  UI.syncing=true;render();
  setTimeout(function(){
    var n=b.pendSync;b.online=true;b.pendSync=0;b.lastSync=Date.now();UI.syncing=false;
    S.tickets.forEach(function(t){if(!t.sync&&(t.balEnt===b.id||t.balSal===b.id))t.sync=true;});
    audit('Sincronización completada',b.nombre+': '+n+' registros enviados al repositorio central');save();

  '</div><div class="dash">'+
   '<section class="card pad"><h2 style="margin-bottom:12px">Toneladas netas por hora</h2><div class="bars">'+bars+'</div><div class="bars-x">'+xs+'</div></section>'+

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.getAttribute('data-act');var id=el.getAttribute('data-id');
  switch(a){
    case 'login':e.preventDefault();doLogin();break;
    case 'logout':audit('Cierre de sesión',turnoCorto());S.user=null;UI.modo='nuevo';UI.sel=null;UI.captura=null;save();render();break;

        $('#rs-ok',dlg).addEventListener('click',function(){var u=S.user,bid=S.balanzaId;S=seed();S.user=u;S.balanzaId=bid;UI.modo='nuevo';UI.sel=null;UI.captura=null;UI.draft=blankDraft();SC.objetivo=0;save();dlg.close();render();toast('Datos de ejemplo reiniciados.');});
      });break;
    case 'capturar':capturar();break;
    case 'registrar':registrar();break;
    case 'limpiar':UI.draft=blankDraft();UI.captura=null;renderTicketCol();break;
    case 'sel':seleccionar(id);break;
    case 'nuevo':SC.objetivo=0;UI.modo='nuevo';UI.sel=null;UI.captura=null;renderTicketCol();break;
    case 'cerrar':cerrar();break;
    case 'anular':openAnular(Number(id));break;
    case 'imprimir':openComprobante(Number(id),true);break;
    case 'enviar':openMail(tk(Number(id)));break;
    case 'manual':openManual();break;
    case 'sim-subir':simSubir();break;
    case 'sim-bajar':SC.objetivo=0;break;
    case 'sim-conn':toggleConn();break;
    case 'ticket':openTicket(Number(id));break;
    case 'exportar':audit('Exportación de datos','Consulta exportada a Excel');toast('Exportación generada. En la demo no se descargan archivos.');break;
    case 'm-add':openMaestro(el.getAttribute('data-ent'),null);break;
    case 'm-edit':openMaestro(el.getAttribute('data-ent'),id);break;
    case 'reglas-save':saveReglas();break;
    case 'cal-add':openCal();break;
  }
});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target&&e.target.id==='login-form')doLogin();});
function onBind(e){
  var el=e.target;var b=el.getAttribute&&el.getAttribute('data-bind');if(!b)return;
  var val=el.type==='checkbox'?el.checked:el.value;
  if(b==='puesto'){if(e.type!=='change')return;S.balanzaId=Number(val);UI.modo='nuevo';UI.sel=null;UI.captura=null;save();render();return;}
  if(b.indexOf('d.')===0){
    var k=b.slice(2);UI.draft[k]=val;
    if(k==='clienteId'||k==='productoId'){var sb=$('#sim-box');if(sb)sb.value=simTxt();}
    if(k==='dni'){var cb=$('#chofer-box');if(cb&&e.type==='input')cb.innerHTML=choferBox();}
    if(k==='patente'||k==='acoplado'){var pp=$('#plate-prev');if(pp)pp.innerHTML=platePrev();}
    updateLive();return;
  }
  if(b==='obs2'){UI.obs2=val;return;}
  if(b==='confirmExceso'){UI.confirmExceso=val;var bc=$('#btn-cerrar');var t=tk(UI.sel);if(bc&&t)bc.disabled=!canCerrar(t);return;}
  if(b==='pq'){UI.pq=val;var pl=$('#plist');if(pl)pl.innerHTML=pendItems();return;}
  if(b.indexOf('tf.')===0){UI.tf[b.slice(3)]=val;var tt=$('#tk-table');if(tt)tt.innerHTML=ticketsTable();return;}
  if(b.indexOf('af.')===0){UI.af[b.slice(3)]=val;var at=$('#au-table');if(at)at.innerHTML=auditTable();return;}
  if(b.indexOf('pf.')===0){if(e.type==='change'){UI.pf[b.slice(3)]=val;render();}return;}
}
document.addEventListener('input',onBind);
document.addEventListener('change',function(e){
  var el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox')onBind(e);
});

render();
})();
</script>
</body>
</html>
